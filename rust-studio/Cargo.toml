[package]
name = "myruststudio"
version = "0.1.0"
edition = "2024"

[dependencies]
dyn-clone = "1.0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.0"
serde_closure = "0.3.3"
md5 = "0.7.0"
aes = "0.8.4"
hex-literal = "0.4.1"
ecb = "0.1.2"
hex = "0.4.3"
# rand_chacha = "0.3.1"
rand_aes = "0.3.1"
rand = {version = "0.8.5", features = ["std"]}
rand_core = "0.9.3" 
# { version = "0.9.3", default-features = false }
anyhow = "1.0.80"
# aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }

rsa = "0.10.0-rc.5"
# sha2 = "0.10.8"
sha2="0.11.0-rc.0"
# sha2 = { version = "0.11.0-rc.0", optional = true, default-features = false, features = ["oid"] }
# rand_chacha = "0.3.1"
rand_chacha = "0.9"
sha1 = "0.10.6"

crypto-bigint = { version = "0.7.0-rc.2", default-features = false, features = ["zeroize", "alloc"] }
base64ct = { version = "1", features = ["alloc"] }
markdown2pdf="0.1"
[[example]]
name="enumfn"
path="src/enumfn.rs"
[[example]]
name="test"
path="src/trait.rs"

[[example]]
name="rsa"
path="src/crypto/rust_crypto_demo/main.rs"


[[example]]
name="oaep"
path="src/crypto/rust_crypto_demo/main1.rs"
[[example]]
name="const"
path="src/const/const5.rs"